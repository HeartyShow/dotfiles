set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -gq utf8-default on
set -sg escape-time 0
set -g mouse on

set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set-option -g status-position bottom

unbind r
bind -N "Reload tmux config" r source-file ~/.tmux.conf

set -gq allow-passthrough on
set -g visual-activity off
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# Window management
set -g base-index 1
set -g renumber-windows on
set -g set-titles on
setw -g automatic-rename off
setw -g allow-rename off
set -g set-titles-string "#S > #W"

unbind n
unbind p

# Pane management
setw -g pane-base-index 1

unbind %
bind -N "Split pane horizontally" b split-window -h -c "#{pane_current_path}"
unbind '"'
bind -N "Split pane vertically" v split-window -v -c "#{pane_current_path}"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

unbind -T root C-:
bind -N "Zoom pane" -n C-z resize-pane -Z

set-option -gw xterm-keys on

unbind o
bind -r ] copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

bind-key -N "Kill pane" x kill-pane
bind-key -N "Kill window" X kill-window
set -g detach-on-destroy off  # don't exit from tmux when closing a session

bind-key -N "Session picker (sesh)" "f" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T ' Sessions ' \
  "tv sesh ."

bind-key -N "GitHub dashboard (gh-dash)" "g" display-popup -E -w 95% -h 90% -d '#{pane_current_path}' -T ' GitHub ' \
  gh-dash

bind-key -N "Review worktree changes (tuicr)" "t" display-popup -E -w 95% -h 90% -d '#{pane_current_path}' -T ' Review ' \
  "tuicr"

# Plugin management
# tpm plugin manager
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'alexwforsythe/tmux-which-key'

# plugins config
set -g @tmux-which-key-xdg-enable 1 # menu in ~/.config/tmux/plugins/tmux-which-key/config.yaml
set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

# theme config
set -g status-left ""
set -g status-right ""

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_background "#{@thm_bg}"

run ~/.tmux/plugins/catppuccin/catppuccin.tmux

set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"
set -g status-right "#{E:@catppuccin_status_session}"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Machine-local tmux overrides (not committed)
source-file -q ~/.config/local/tmux.conf

# Move between tmux panes (keep this line at the very bottom of tmux.conf)
unbind C-h
bind -N "Previous window" -r C-h previous-window
unbind C-l
bind -N "Next window" -r C-l next-window
