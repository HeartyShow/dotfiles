# Worktrunk global configuration
# Worktrees are created by the Rex worktree picker (ctrl+space>w), see rex/.config/rex/scripts/worktrees.sh

# Worktree path: subdirectory of the project root (bare repo layout)
# .git/ is the bare repo, worktrees are siblings: project/main/, project/feature/, etc.
worktree-path = "{{ repo_path }}/../{{ branch | sanitize_db }}"

# --- Hooks ---

# When a new worktree is created, install tools via mise if configured
[post-start]
setup = "[ -f .mise.toml ] && mise install --yes 2>/dev/null || true"
